<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body)}.l{font:600 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}.m{font:500 12px/1.3 ui-monospace,Menlo,monospace;color:var(--text-muted)}</style></head><body><style>@keyframes lp{0%,40%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}75%,100%{transform:scale(1);opacity:1}}</style><div style="display:flex;gap:32px;align-items:center"><div style="width:44px;height:44px;border-radius:50%;background:var(--mp-green);animation:lp 2s var(--ease-pop) infinite"></div><div class="m" style="line-height:1.7">--ease-out cubic-bezier(.2,.7,.2,1) · UI transitions<br>--ease-pop cubic-bezier(.34,1.56,.64,1) · correct / ajá only<br>--dur-fast 120 · --dur-base 200 · --dur-slow 320</div></div></body></html>
