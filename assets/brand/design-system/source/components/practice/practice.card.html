<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:16px}.lab{font:600 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);width:84px;flex:none}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const D=window.MePreparoDesignSystem_20851d;const {ExerciseCard,AnswerOption,HintBox,FeedbackBanner}=D;

function App(){const [s,setS]=React.useState('B');const opts=[['A','(1, 2)'],['B','(2, −1)'],['C','(2, 3)'],['D','(4, −1)']];
return <div className="row" style={{alignItems:'flex-start',gap:20}}>
<ExerciseCard axis="M1" topic="Funciones cuadráticas" style={{width:400}} question={<>La función <span className="mp-math">f(x) = x² − 4x + 3</span><br/>¿cuál es su vértice?</>}
 footer={<><HintBox>El vértice se encuentra en <span className="mp-math">x = −b / 2a</span>.</HintBox><FeedbackBanner tone="correct" title="¡Correcto!"/></>}>
 {opts.map(([l,t])=><AnswerOption key={l} letter={l} state={s===l?'selected':'idle'} onClick={()=>setS(l)}>{t}</AnswerOption>)}
</ExerciseCard>
<div className="col" style={{flex:1,gap:8}}><span className="lab" style={{width:'auto'}}>States</span>
<AnswerOption letter="A">idle</AnswerOption><AnswerOption letter="B" state="selected">selected</AnswerOption><AnswerOption letter="C" state="correct">correct</AnswerOption><AnswerOption letter="D" state="incorrect">incorrect</AnswerOption><AnswerOption letter="E" state="dimmed">dimmed</AnswerOption>
<FeedbackBanner tone="retry" title="Casi. Revisa el signo."/><FeedbackBanner tone="aja" title="¡Ajá!"/></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
